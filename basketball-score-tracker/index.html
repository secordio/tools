<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Basketball Score Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 40px;
      gap: 28px;
    }

    h1 {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #555;
    }

    .court {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0;
      width: 100%;
      max-width: 680px;
      align-items: start;
    }

    /* ── Team Panel ── */
    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 24px 12px;
    }

    .team-name-wrap {
      position: relative;
      width: 100%;
      text-align: center;
    }

    .team-name {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
      padding: 4px 2px;
      touch-action: manipulation;
    }

    .team-name:focus { border-bottom-color: currentColor; }
    .team-name::placeholder { color: #444; }

    .team-a .team-name { color: #4f9eff; }
    .team-b .team-name { color: #ff6b4f; }

    .score {
      font-size: clamp(72px, 18vw, 120px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
    }

    .team-a .score { color: #4f9eff; }
    .team-b .score { color: #ff6b4f; }

    .btns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .btn {
      border: none;
      border-radius: 16px;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      padding: 28px 8px;
      transition: transform 0.08s, opacity 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      line-height: 1;
    }

    .btn:active { transform: scale(0.94); opacity: 0.85; }

    .team-a .btn-plus { background: #1a3a5c; color: #4f9eff; }
    .team-a .btn-plus:hover { background: #1e4570; }
    .team-a .btn-minus { background: #1e1e1e; color: #666; }
    .team-a .btn-minus:hover { background: #2a2a2a; }

    .team-b .btn-plus { background: #4a1f18; color: #ff6b4f; }
    .team-b .btn-plus:hover { background: #5a2820; }
    .team-b .btn-minus { background: #1e1e1e; color: #666; }
    .team-b .btn-minus:hover { background: #2a2a2a; }

    .minus-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
    }

    .btn-minus {
      font-size: 18px !important;
      padding: 16px 8px !important;
      border-radius: 12px !important;
      width: 60%;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px 12px;
      padding-top: 64px;
    }

    .vs {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: #333;
      text-transform: uppercase;
    }

    .diff-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .diff {
      font-size: 28px;
      font-weight: 800;
      color: #f0f0f0;
      font-variant-numeric: tabular-nums;
      min-width: 52px;
      text-align: center;
    }

    .diff-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #444;
      text-transform: uppercase;
    }

    /* ── New Game ── */
    .new-game-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #555;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 28px;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 0.2s, color 0.2s;
    }

    .new-game-btn:hover { border-color: #555; color: #aaa; }

    /* ── Clock ── */
    .clock-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 360px;
      border-top: 1px solid #1e1e1e;
      padding-top: 24px;
    }

    .clock-display {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color: #3a3a3a;
      transition: color 0.3s;
    }

    .clock-display.running { color: #888; }

    .clock-btns {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .clock-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #555;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .clock-btn:hover { background: #222; color: #888; border-color: #3a3a3a; }
    .clock-btn:active { opacity: 0.7; }

    .clock-btn.start-stop {
      font-size: 14px;
      padding: 12px 28px;
      background: #1a1a1a;
      border-color: #2e2e2e;
    }

    .clock-btn.start-stop.active {
      color: #f0f0f0;
      border-color: #444;
    }

    .clock-btn.skip { font-size: 12px; }

    @media (max-width: 440px) {
      .btn { font-size: 20px; padding: 24px 6px; }
      .btns { gap: 7px; }
    }
  </style>
</head>
<body>

  <h1>Basketball</h1>

  <div class="court">

    <!-- Team A -->
    <div class="team team-a">
      <div class="team-name-wrap">
        <input class="team-name" id="nameA" type="text" placeholder="Home" maxlength="14" />
      </div>
      <div class="score" id="scoreA">0</div>
      <div class="btns">
        <button class="btn btn-plus" onclick="add('A',1)">+1</button>
        <button class="btn btn-plus" onclick="add('A',2)">+2</button>
        <button class="btn btn-plus" onclick="add('A',3)">+3</button>
        <div class="minus-row">
          <button class="btn btn-minus" onclick="add('A',-1)">−1</button>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <span class="vs">vs</span>
      <div class="diff-wrap">
        <div class="diff" id="diff">—</div>
        <div class="diff-label">diff</div>
      </div>
    </div>

    <!-- Team B -->
    <div class="team team-b">
      <div class="team-name-wrap">
        <input class="team-name" id="nameB" type="text" placeholder="Away" maxlength="14" />
      </div>
      <div class="score" id="scoreB">0</div>
      <div class="btns">
        <button class="btn btn-plus" onclick="add('B',1)">+1</button>
        <button class="btn btn-plus" onclick="add('B',2)">+2</button>
        <button class="btn btn-plus" onclick="add('B',3)">+3</button>
        <div class="minus-row">
          <button class="btn btn-minus" onclick="add('B',-1)">−1</button>
        </div>
      </div>
    </div>

  </div>

  <button class="new-game-btn" onclick="newGame()">New Game</button>

  <!-- Clock -->
  <div class="clock-section">
    <div class="clock-display" id="clockDisplay">0:00</div>
    <div class="clock-btns">
      <button class="clock-btn skip" onclick="skipClock(-10)">−10s</button>
      <button class="clock-btn start-stop" id="startStopBtn" onclick="toggleClock()">Start</button>
      <button class="clock-btn skip" onclick="skipClock(10)">+10s</button>
    </div>
    <button class="clock-btn" onclick="resetClock()" style="font-size:11px; padding:7px 16px; opacity:0.5;">Reset</button>
  </div>

  <script>
    // ── Score ──
    let scores = { A: 0, B: 0 };

    function add(team, pts) {
      scores[team] = Math.max(0, scores[team] + pts);
      renderScore();
    }

    function renderScore() {
      document.getElementById('scoreA').textContent = scores.A;
      document.getElementById('scoreB').textContent = scores.B;
      const d = scores.A - scores.B;
      document.getElementById('diff').textContent = d === 0 ? 'TIE' : (d > 0 ? '+' + d : d);
    }

    function newGame() {
      scores.A = 0;
      scores.B = 0;
      renderScore();
      resetClock();
    }

    renderScore();

    // ── Clock ──
    let elapsed = 0;   // seconds
    let timerID = null;

    function toggleClock() {
      if (timerID) {
        clearInterval(timerID);
        timerID = null;
      } else {
        timerID = setInterval(() => { elapsed++; renderClock(); }, 1000);
      }
      renderClock();
    }

    function skipClock(sec) {
      elapsed = Math.max(0, elapsed + sec);
      renderClock();
    }

    function resetClock() {
      clearInterval(timerID);
      timerID = null;
      elapsed = 0;
      renderClock();
    }

    function renderClock() {
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      document.getElementById('clockDisplay').textContent =
        m + ':' + String(s).padStart(2, '0');

      const running = !!timerID;
      document.getElementById('clockDisplay').classList.toggle('running', running);
      const btn = document.getElementById('startStopBtn');
      btn.textContent = running ? 'Stop' : 'Start';
      btn.classList.toggle('active', running);
    }

    renderClock();
  </script>
</body>
</html>
